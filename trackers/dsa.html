<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#2451D9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prep Guide">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<title>DSA Pattern Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F7; --panel:#FFFFFF; --ink:#18212E; --ink2:#5B6675; --line:#DCE1E8;
  --acc:#2451D9; --acc-soft:#E3E9FB; --done:#1E8F5A; --done-soft:#DDF3E8; --warn:#C7641B; --warn-soft:#FCEBDD;
  --dot:#D4D9E1; --radius:10px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141922; --panel:#1C2330; --ink:#EEF1F5; --ink2:#9AA5B5; --line:#2C3542;
  --acc:#7C9BFF; --acc-soft:#22305A; --done:#4BC98C; --done-soft:#173A2B; --warn:#F0A05C; --warn-soft:#3F2A14; --dot:#2F3947;
}}
:root[data-theme="dark"]{
  --bg:#141922; --panel:#1C2330; --ink:#EEF1F5; --ink2:#9AA5B5; --line:#2C3542;
  --acc:#7C9BFF; --acc-soft:#22305A; --done:#4BC98C; --done-soft:#173A2B; --warn:#F0A05C; --warn-soft:#3F2A14; --dot:#2F3947;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.5}
button,textarea,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font-size:26px;font-weight:700;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink2);margin:2px 0 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:focus-visible,textarea:focus-visible,input:focus-visible,.dot:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.status{font-size:13px;color:var(--ink2)}

/* Matrix hero */
.matrix{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 14px;margin-bottom:22px;overflow-x:auto}
.mgrid{display:grid;grid-template-columns:72px repeat(20,minmax(28px,1fr));gap:6px;align-items:center;min-width:760px}
.mgrid .lbl{font-size:12px;color:var(--ink2)}
.mgrid .wk{font-size:12px;color:var(--ink2);text-align:center;cursor:pointer;padding:2px 0;border-radius:6px;border:none;background:none}
.mgrid .wk.cur{color:var(--acc);font-weight:600;background:var(--acc-soft)}
.dot{width:100%;aspect-ratio:1;border-radius:50%;background:var(--dot);border:none;cursor:pointer;padding:0;position:relative}
.dot.done{background:var(--done)}
.dot.unaided::after{content:"";position:absolute;inset:32%;border-radius:50%;background:var(--panel)}
.dot.today{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--acc)}
.dot.revisit{background:var(--warn)}
.mfoot{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px;font-size:13px;color:var(--ink2);align-items:center}
.mfoot b{color:var(--ink);font-weight:600}
.key{display:inline-flex;align-items:center;gap:6px}
.key i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--dot)}
.key i.d{background:var(--done)} .key i.r{background:var(--warn)}
.bar{height:6px;background:var(--dot);border-radius:3px;flex:1;min-width:140px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--done);width:0}

/* Week */
.week{display:grid;grid-template-columns:300px 1fr;gap:18px}
@media (max-width:820px){.week{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card h2{margin:0 0 4px;font-size:18px}
.phase{font-size:13px;color:var(--ink2);margin-bottom:12px}
.tell{background:var(--acc-soft);border-radius:8px;padding:10px 12px;font-size:14px;margin:10px 0 14px}
.tell b{display:block;font-size:12px;color:var(--acc);margin-bottom:2px;font-weight:600}
.navrow{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:9px 10px;min-height:70px;resize:vertical}
label.small{display:block;font-size:13px;color:var(--ink2);margin:12px 0 5px}

.day{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:none;padding-top:0}
.day.done .pname{text-decoration:line-through;color:var(--ink2)}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:none;cursor:pointer;margin-top:2px;display:grid;place-items:center;padding:0}
.day.done .check{background:var(--done);border-color:var(--done);color:#fff}
.dtop{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.dnum{font-size:12px;color:var(--ink2);width:44px}
.pname{font-weight:600;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}.pname:hover{color:var(--acc);border-color:var(--acc)}
.pill{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--ink2)}
.pill.on{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.pill.warn.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.stretch{font-size:12px;color:var(--warn)}
.dlog{display:none;margin-top:10px}
.day.open .dlog{display:block}
.dlog textarea{min-height:56px}
.toggle{font-size:13px;color:var(--acc);background:none;border:none;cursor:pointer;padding:0;margin-left:auto}
.sunday{border-top:1px dashed var(--line);padding-top:14px;margin-top:4px;color:var(--ink2);font-size:14px}
.empty{color:var(--ink2);font-size:14px;margin-top:8px}
.settings{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.settings input{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--panel)}
@media (prefers-reduced-motion:no-preference){.dot.today{animation:pulse 2s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 2px var(--panel),0 0 0 6px var(--acc-soft)}}

/* Lesson */
.lesson{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:4px 18px 18px;margin-bottom:18px}
.lesson summary{cursor:pointer;font-weight:600;font-size:16px;padding:14px 0;list-style:none;display:flex;align-items:center;gap:10px}
.lesson summary::before{content:"▸";color:var(--acc);font-size:14px}
.lesson details[open] summary::before{content:"▾"}
.lesson summary::-webkit-details-marker{display:none}
.lbody{max-width:78ch}
.lbody h4{margin:18px 0 6px;font-size:15px}
.lbody p{margin:6px 0}
.lbody table{border-collapse:collapse;margin:8px 0;font-size:14px;width:100%}
.lbody th,.lbody td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.lbody th{color:var(--ink2);font-weight:500}
.lbody code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:.92em}
.lbody pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow-x:auto;font-size:13.5px;line-height:1.45;max-width:none}
.lbody ol,.lbody ul{padding-left:22px;margin:6px 0}
.lbody li{margin:4px 0}
.probs li{margin:8px 0}
.probs b{color:var(--acc)}
.traps{background:var(--warn-soft);border-radius:8px;padding:10px 14px;margin-top:12px}
.traps ul{margin:4px 0}
.ltabs{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.ltab{border:1px solid var(--line);background:none;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13.5px;color:var(--ink2)}
.ltab.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.lpane{display:none}.lpane.on{display:block}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>DSA Pattern Tracker</h1>
    <p class="sub">4 weeks of foundations, then 16 patterns. Read the lesson, solve the day's problem, log the tell.</p>
  </div>
  <div class="tools">
    <span class="status" id="status">Saved in this browser</span>
    <button class="btn" id="exportBtn" title="Download your progress as a JSON file">Export</button>
    <button class="btn" id="importBtn" title="Load progress from an exported JSON file">Import</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</header>

<section class="matrix" aria-label="Progress matrix">
  <div class="mgrid" id="mgrid"></div>
  <div class="mfoot">
    <span><b id="doneCount">0</b> / 120 solved</span>
    <span><b id="unaidedCount">0</b> unaided</span>
    <span><b id="revisitCount">0</b> to revisit</span>
    <div class="bar"><span id="bar"></span></div>
    <span class="key"><i class="d"></i> solved</span>
    <span class="key"><i class="d" style="box-shadow:inset 0 0 0 3px var(--panel);border:1px solid var(--done)"></i> unaided</span>
    <span class="key"><i class="r"></i> revisit</span>
    <span class="settings">Start date <input type="date" id="startDate"></span>
  </div>
</section>

<section class="lesson" id="lcard"></section>

<section class="week">
  <aside class="card" id="wcard"></aside>
  <div class="card" id="dcard"></div>
</section>
</div>

<script>
const PLAN = [
 {ph:"Foundations",t:"Arrays, strings & Big-O",tell:"Learn to say the time/space cost of every loop you write before you run it.",p:["Two Sum","Contains Duplicate","Reverse String","Best Time to Buy and Sell Stock","Move Zeroes","Merge Sorted Array"]},
 {ph:"Foundations",t:"Hash maps & sets",tell:"Need to look something up fast, count things, or check 'seen before'?",p:["Valid Anagram","Majority Element","Intersection of Two Arrays II","First Unique Character in a String","Ransom Note","Isomorphic Strings"]},
 {ph:"Foundations",t:"Recursion & basic sorting",tell:"Define the problem in terms of a smaller version of itself; know the base case first.",p:["Fibonacci Number","Power of Two (recursive)","Reverse a String (recursive)","Sort an Array (implement merge sort)","Kth Largest via sort (Sort Colors)","Pow(x, n)"]},
 {ph:"Foundations",t:"Build the structures yourself",tell:"Implement it once by hand so every later problem reads as 'oh, it's just a queue'.",p:["Implement Stack using Queues","Implement Queue using Stacks","Design Linked List","Design HashMap","Binary Tree Inorder Traversal (iterative + recursive)","Implement a Graph (adjacency list) + BFS on Number of Islands"]},
 {ph:"Core patterns",t:"Two pointers",tell:"Sorted array, pairs or triplets, in-place, palindrome checks.",p:["Two Sum II","Valid Palindrome","Remove Duplicates from Sorted Array","Container With Most Water","3Sum","Trapping Rain Water"]},
 {ph:"Core patterns",t:"Sliding window",tell:"Contiguous subarray/substring; longest or shortest with at most K of something.",p:["Maximum Average Subarray I (fixed window k)","Longest Substring Without Repeating Characters","Minimum Size Subarray Sum","Longest Repeating Character Replacement","Permutation in String","Minimum Window Substring"]},
 {ph:"Core patterns",t:"Prefix sums & hashing",tell:"Range sums, count subarrays with sum K, frequency matching.",p:["Range Sum Query Immutable","Subarray Sum Equals K","Contiguous Array","Product of Array Except Self","Group Anagrams","Longest Consecutive Sequence"]},
 {ph:"Core patterns",t:"Binary search (incl. on the answer)",tell:"Sorted or monotonic; minimum X such that a condition holds.",p:["Binary Search","First Bad Version","Search in Rotated Sorted Array","Find Minimum in Rotated Sorted Array","Koko Eating Bananas","Median of Two Sorted Arrays*"]},
 {ph:"Core patterns",t:"Stack & monotonic stack",tell:"Matching brackets, next greater/smaller element, spans.",p:["Valid Parentheses","Min Stack","Daily Temperatures","Next Greater Element II","Largest Rectangle in Histogram","Evaluate Reverse Polish Notation"]},
 {ph:"Core patterns",t:"Linked lists & fast/slow pointers",tell:"Cycle detection, find the middle, reverse in place.",p:["Reverse Linked List","Middle of the Linked List","Linked List Cycle II","Merge Two Sorted Lists","Reorder List","Remove Nth Node From End of List"]},
 {ph:"Trees, graphs, recursion",t:"Binary trees (DFS)",tell:"Recursive structure; answer built from children's answers.",p:["Maximum Depth of Binary Tree","Invert Binary Tree","Diameter of Binary Tree","Balanced Binary Tree","Lowest Common Ancestor","Path Sum II"]},
 {ph:"Trees, graphs, recursion",t:"BFS & BST properties",tell:"Level by level; ordering guarantees from a BST.",p:["Level Order Traversal","Binary Tree Right Side View","Validate BST","Kth Smallest Element in a BST","Serialize and Deserialize Binary Tree","Binary Tree Maximum Path Sum*"]},
 {ph:"Trees, graphs, recursion",t:"Graph traversal",tell:"Grids, islands, connectivity, adjacency lists.",p:["Number of Islands","Clone Graph","Max Area of Island","Rotting Oranges","Pacific Atlantic Water Flow","Surrounded Regions"]},
 {ph:"Trees, graphs, recursion",t:"Topological sort & union-find",tell:"Prerequisites and dependencies; merging components.",p:["Course Schedule","Course Schedule II","Number of Connected Components","Redundant Connection","Graph Valid Tree","Accounts Merge"]},
 {ph:"Trees, graphs, recursion",t:"Backtracking",tell:"All combinations/permutations/subsets; constraint satisfaction.",p:["Subsets","Permutations","Combination Sum","Word Search","Palindrome Partitioning","N-Queens"]},
 {ph:"Optimization patterns",t:"Heaps & greedy",tell:"Top K, K-th largest, scheduling, intervals.",p:["Kth Largest Element in an Array","Top K Frequent Elements","K Closest Points to Origin","Merge Intervals","Non-overlapping Intervals","Task Scheduler"]},
 {ph:"Optimization patterns",t:"1-D dynamic programming",tell:"Number of ways, min/max cost to reach, overlapping subproblems.",p:["Climbing Stairs","House Robber","Coin Change","Longest Increasing Subsequence","Word Break","Decode Ways"]},
 {ph:"Optimization patterns",t:"2-D & string DP",tell:"Two indices or two strings; grid paths; substrings.",p:["Unique Paths","Longest Common Subsequence","Edit Distance","Partition Equal Subset Sum","Longest Palindromic Substring","Best Time to Buy and Sell Stock with Cooldown"]},
 {ph:"Optimization patterns",t:"Shortest paths & advanced graphs",tell:"Weighted edges, minimum cost/time, K stops.",p:["Network Delay Time","Cheapest Flights Within K Stops","Min Cost to Connect All Points","Word Ladder","Alien Dictionary","Swim in Rising Water"]},
 {ph:"Integration",t:"Mixed mock sets",tell:"No tags. Name the pattern within 5 minutes before you code.",p:["Random medium #1","Random medium #2","Random medium #3","Random hard #1","Random hard #2","Random hard #3"]},
];


const LESSONS = {"0": {"concept": "<p>Every problem this week is solved by one pass over an array with a little extra memory. The skill is not the solutions; it is the habit of asking, before you write code: <b>how many times will this loop run, and what am I storing?</b></p>\n<h4>Big-O in five minutes</h4>\n<p>Big-O describes how work grows as the input size n grows. Keep only the dominant term and drop constants.</p>\n<table><tr><th>What your code does</th><th>Cost</th><th>Feels like</th></tr>\n<tr><td>Fixed steps, no loop</td><td>O(1)</td><td>Instant</td></tr>\n<tr><td>Halve the input each step</td><td>O(log n)</td><td>~30 steps for a billion items</td></tr>\n<tr><td>One loop over the input</td><td>O(n)</td><td>Read everything once</td></tr>\n<tr><td>Sort, or a loop with halving inside</td><td>O(n log n)</td><td>Fine up to millions</td></tr>\n<tr><td>Loop inside a loop over the same input</td><td>O(n\u00b2)</td><td>Fine to ~10,000, then dies</td></tr></table>\n<p>Three rules cover 90% of cases: sequential loops <b>add</b> (O(n)+O(n)=O(n)); nested loops <b>multiply</b>; a hash map lookup is O(1) but <code>x in list</code> is O(n). Space works the same way: a counter is O(1), a copy of the array is O(n).</p>\n<h4>Arrays and strings</h4>\n<p>Indexing is O(1). Append at the end is O(1). Insert or delete in the middle is O(n) because everything shifts. Strings are immutable in most languages, so <code>s += ch</code> in a loop is O(n\u00b2): collect into a list and join once. \"In-place\" means O(1) extra space: you reorganise using indices, not a second array.</p>", "template": "# Running best (Day 4 shape)\ndef max_profit(prices):\n    lo, best = prices[0], 0\n    for p in prices[1:]:        # one pass -> O(n)\n        best = max(best, p - lo)\n        lo = min(lo, p)\n    return best                 # O(1) extra space\n\n# Read pointer / write pointer (Day 5 shape)\ndef move_zeroes(a):\n    w = 0\n    for r in range(len(a)):\n        if a[r] != 0:\n            a[w], a[r] = a[r], a[w]\n            w += 1", "problems": ["Two Sum: as you scan, store value\u2192index in a map; for each x check whether target\u2212x is already there. One pass, O(n) time and space. This is the week's model: trade memory for a second loop.", "Contains Duplicate: write all three \u2014 nested loop O(n\u00b2); sort then compare neighbours O(n log n) / O(1) space; a set O(n) / O(n). Log the trade-off; that comparison is the exercise.", "Reverse String: two indices at each end, swap and walk inward. O(n), O(1) space. You will meet this again as two pointers.", "Best Time to Buy and Sell Stock: track the lowest price so far and the best profit so far in one pass. The trap is thinking you must compare every pair.", "Move Zeroes: read index scans, write index marks where the next non-zero goes; fill zeroes after (or swap as you go). Memorise the read/write shape.", "Merge Sorted Array: merge from the back. Start at the end of both valid regions and at the end of the big array; place the larger, walk backwards. Merging from the front overwrites unread values."], "traps": ["Forgetting that <code>x in list</code> is a hidden loop.", "Building strings with += in a loop.", "Declaring a solution O(n) when the sort you called is O(n log n)."]}, "1": {"concept": "<p>A hash map (dictionary) gives O(1) average insert, lookup and delete by turning a key into an array index with a hash function. A set is a map with no values. Use them whenever a problem says, in any words, <b>seen before</b>, <b>count</b>, <b>group</b>, or <b>match one thing to another</b>.</p>\n<h4>How it works, briefly</h4>\n<p>The key is hashed to a bucket index. Collisions (two keys, one bucket) are handled by chaining or probing; when the table gets full it doubles and rehashes. That is why average cost is O(1) but the worst case is O(n), and why keys must be immutable (strings, numbers, tuples; never lists).</p>\n<h4>Three moves you will reuse forever</h4>\n<ol><li><b>Frequency count</b>: <code>cnt[x] = cnt.get(x, 0) + 1</code>. Compare two counts to test anagrams; find the first key with count 1; check that one count is \"covered\" by another.</li>\n<li><b>Seen set</b>: add as you go, and act the first time you see a repeat.</li>\n<li><b>Mapping consistency</b>: map a\u2192b and b\u2192a at the same time to check a one-to-one correspondence (isomorphic strings, word patterns).</li></ol>\n<p>Rule of thumb: if you find yourself writing a nested loop that searches for something, the inner loop probably wants to be a map lookup.</p>", "template": "from collections import Counter, defaultdict\n\ndef is_anagram(s, t):\n    return Counter(s) == Counter(t)          # O(n)\n\ndef first_unique(s):\n    c = Counter(s)\n    for i, ch in enumerate(s):               # second pass keeps order\n        if c[ch] == 1: return i\n    return -1\n\ndef isomorphic(s, t):\n    m1, m2 = {}, {}\n    for a, b in zip(s, t):\n        if m1.setdefault(a, b) != b or m2.setdefault(b, a) != a:\n            return False\n    return True", "problems": ["Valid Anagram: compare two frequency counts (or an array of 26 ints for lowercase letters). O(n) vs sorting's O(n log n).", "Majority Element: count frequencies and return the key with count > n/2. Then learn Boyer\u2013Moore voting for O(1) space: keep a candidate and a counter, increment on match, decrement otherwise, reset when zero.", "Intersection of Two Arrays II: count the smaller array; scan the larger, emit when count > 0 and decrement. Handles duplicates correctly.", "First Unique Character: one pass to count, a second pass in order to find the first count-1 character. Two passes are still O(n).", "Ransom Note: count the magazine; for each note letter decrement; fail when a count would go negative.", "Isomorphic Strings: two maps, one each direction; every pair must agree with what was mapped before."], "traps": ["Using a list where a set is needed (turns O(n) into O(n\u00b2)).", "Forgetting the second, ordered pass when order matters.", "Mapping only one direction in one-to-one problems."]}, "2": {"concept": "<p>Recursion is a function that solves a problem by calling itself on a smaller version of the same problem. Every correct recursive function has exactly two parts, and you write them in this order:</p>\n<ol><li><b>Base case</b>: the smallest input, answered directly, no recursive call. Write this first, always.</li>\n<li><b>Recursive step</b>: assume the call on the smaller input already works (this is the leap of faith), then combine its answer into yours.</li></ol>\n<p>Under the hood each call gets a stack frame; depth n uses O(n) stack memory, which is why very deep recursion overflows and why an iterative version sometimes matters.</p>\n<h4>Cost of recursion</h4>\n<p>Count calls \u00d7 work per call. Fibonacci naively makes ~2\u207f calls; memoisation (cache the answer per input) drops it to O(n). Halving the problem each call with O(n) merging work gives O(n log n), which is merge sort.</p>\n<h4>Sorting you must know</h4>\n<p><b>Merge sort</b>: split in half, sort each half recursively, merge two sorted lists in O(n). Stable, O(n log n) always, O(n) extra space. <b>Quick sort</b>: pick a pivot, partition smaller/larger, recurse; O(n log n) average, O(n\u00b2) worst. Built-in sorts are O(n log n): know that cost when you call them. Counting sort (Sort Colors) is O(n) when values come from a tiny fixed set.</p>", "template": "def merge_sort(a):\n    if len(a) <= 1: return a                 # base case\n    mid = len(a) // 2\n    L, R = merge_sort(a[:mid]), merge_sort(a[mid:])\n    out, i, j = [], 0, 0\n    while i < len(L) and j < len(R):         # merge, O(n)\n        if L[i] <= R[j]: out.append(L[i]); i += 1\n        else:            out.append(R[j]); j += 1\n    return out + L[i:] + R[j:]\n\ndef fib(n, memo={}):\n    if n < 2: return n\n    if n not in memo: memo[n] = fib(n-1) + fib(n-2)\n    return memo[n]", "problems": ["Fibonacci: write the naive version, watch it crawl at n=35, add a memo, watch it become instant. Log both complexities.", "Power of Two: base cases n==1 (true) and n<=0 or odd (false); otherwise recurse on n//2. Then the O(1) bit trick: n & (n\u22121) == 0.", "Reverse a String recursively: reverse(s) = reverse(s[1:]) + s[0]. Note it is O(n\u00b2) because of string slicing \u2014 a good lesson that recursion is not free.", "Sort an Array: implement merge sort by hand without looking. Then implement the in-place merge on indices for extra credit.", "Sort Colors: values are only 0/1/2, so count them and rewrite (counting sort, two passes). Then try Dutch national flag with three pointers in one pass.", "Pow(x, n): halve the exponent: pow(x,n) = pow(x,n//2)\u00b2 times x if n is odd. O(log n). Handle negative n."], "traps": ["Writing the recursive step before the base case.", "Recomputing the same subproblem (add a memo).", "Slicing lists inside recursion and not counting that cost."]}, "3": {"concept": "<p>You will use these structures from a library for the rest of the plan, but implementing each once turns them from black boxes into shapes you recognise instantly in a problem statement.</p>\n<h4>Stack (LIFO)</h4><p>Push and pop at one end, both O(1). It is the shape of \"undo\", \"most recent unmatched thing\", and every recursive algorithm (the call stack is a stack).</p>\n<h4>Queue (FIFO)</h4><p>Enqueue at the back, dequeue at the front, O(1) each with a deque or a two-stack trick. It is the shape of \"process things in the order they arrived\" and of breadth-first search.</p>\n<h4>Linked list</h4><p>Nodes with a value and a pointer to the next node. O(1) insert/delete when you already hold the node, O(n) to find anything. Always draw the pointers before writing code; most bugs are a pointer updated in the wrong order.</p>\n<h4>Hash map</h4><p>An array of buckets; hash the key to an index; each bucket holds a small list of (key, value) pairs to survive collisions.</p>\n<h4>Binary tree</h4><p>Each node has a left and right child. Traversal orders: preorder (node, left, right), inorder (left, node, right; sorted order for a BST), postorder (left, right, node). Recursion is natural; the iterative version uses an explicit stack.</p>\n<h4>Graph</h4><p>Store as an adjacency list: a map from node to its neighbours. A grid is a graph where each cell's neighbours are up/down/left/right. BFS uses a queue and a visited set and explores in rings of distance.</p>", "template": "from collections import deque\n\nclass ListNode:\n    def __init__(self, v, nxt=None): self.val, self.next = v, nxt\n\ndef inorder_iter(root):\n    out, st, cur = [], [], root\n    while cur or st:\n        while cur: st.append(cur); cur = cur.left\n        cur = st.pop(); out.append(cur.val); cur = cur.right\n    return out\n\ndef bfs(grid, sr, sc):\n    R, C = len(grid), len(grid[0])\n    q, seen = deque([(sr, sc)]), {(sr, sc)}\n    while q:\n        r, c = q.popleft()\n        for dr, dc in ((1,0),(-1,0),(0,1),(0,-1)):\n            nr, nc = r+dr, c+dc\n            if 0<=nr<R and 0<=nc<C and (nr,nc) not in seen and grid[nr][nc]=='1':\n                seen.add((nr,nc)); q.append((nr,nc))", "problems": ["Implement Stack using Queues: on push, enqueue then rotate the queue so the new item is at the front. Push O(n), pop O(1).", "Implement Queue using Stacks: an in-stack and an out-stack; when out is empty, pour everything from in to out. Amortised O(1) per operation \u2014 understand why.", "Design Linked List: use a dummy head node so insertion at index 0 is not a special case. Draw every pointer change.", "Design HashMap: fixed number of buckets, each a list of pairs; hash = key % buckets. Handle update of an existing key.", "Binary Tree Inorder Traversal: write the 3-line recursive version, then the explicit-stack version above until you can reproduce it cold.", "Adjacency list + BFS: build a graph from an edge list, then run the BFS template on Number of Islands (count how many times you have to start a new BFS)."], "traps": ["Losing the rest of a linked list by overwriting .next before saving it.", "Marking visited when popping instead of when pushing (nodes get queued twice).", "Forgetting the dummy node and special-casing the head."]}, "4": {"concept": "<p>Two pointers means walking through data with two indices that move under a rule, instead of a nested loop that tries every pair. It works when there is some <b>order or monotonic property</b> that tells you which pointer to move.</p>\n<h4>The two shapes</h4>\n<ol><li><b>Opposite ends</b>: l at the start, r at the end, move inward. Use when the array is sorted (or can be sorted) and you need a pair with a target property. Moving l up increases the sum; moving r down decreases it, so at every step exactly one move makes sense.</li>\n<li><b>Same direction (slow/fast)</b>: both start at the front; fast scans, slow marks where the next kept element goes. Use for in-place removal, deduplication, partitioning.</li></ol>\n<p>Why it is O(n): each pointer only ever moves one way, so total moves are bounded by n.</p>\n<h4>Recognising it</h4><p>Sorted input; \"pair/triplet with sum\"; \"in-place\"; palindrome; \"remove duplicates\"; two sequences compared front to back. Sorting first costs O(n log n) and is usually worth it.</p>", "template": "# Opposite ends\ndef two_sum_sorted(a, target):\n    l, r = 0, len(a) - 1\n    while l < r:\n        s = a[l] + a[r]\n        if s == target: return [l, r]\n        if s < target: l += 1\n        else: r -= 1\n\n# Same direction\ndef remove_dups(a):\n    w = 1\n    for r in range(1, len(a)):\n        if a[r] != a[w-1]:\n            a[w] = a[r]; w += 1\n    return w", "problems": ["Two Sum II: opposite ends on the sorted array; sum too small means move l, too big means move r.", "Valid Palindrome: opposite ends; skip non-alphanumerics from each side, compare lowercased characters.", "Remove Duplicates from Sorted Array: same direction; write index only advances when the value differs from the last written.", "Container With Most Water: opposite ends; area is width \u00d7 min height, so always move the shorter side \u2014 moving the taller one can never help.", "3Sum: sort; fix i, then two-pointer on the rest for \u2212a[i]. Skip duplicate values of i, l and r to avoid repeated triplets. O(n\u00b2).", "Trapping Rain Water: opposite ends with leftMax and rightMax; water at the smaller side is bounded by its own max, so process that side and move it."], "traps": ["Moving both pointers at once (usually wrong).", "Forgetting to skip duplicates in 3Sum.", "Using two pointers on unsorted data where no monotonic rule exists."]}, "5": {"concept": "<p>A sliding window is two pointers that bound a <b>contiguous</b> range, plus a small running state (a count, a sum, a map) that describes what is inside the window. You extend the right edge one step at a time and shrink the left edge only when the window becomes invalid.</p>\n<h4>Fixed vs variable window</h4>\n<p><b>Fixed size k</b>: add the new right element, remove the element that fell off the left. <b>Variable size</b>: grow right; while a constraint is violated, shrink left; record the answer whenever the window is valid. For \"longest valid\", record after shrinking. For \"shortest valid\", record inside the shrink loop.</p>\n<h4>The running state is the whole trick</h4><p>Whatever you would recompute for the window each time, keep it incrementally: a sum, a character-count map, the number of distinct keys, the count of \"matched\" characters. Updating that state on add/remove is what makes each step O(1) and the whole thing O(n).</p>\n<h4>Recognising it</h4><p>\"Substring\", \"subarray\", \"contiguous\", \"longest/shortest \u2026 such that\", \"at most k distinct\", \"contains all characters of\".</p>", "template": "def longest_no_repeat(s):\n    last, l, best = {}, 0, 0\n    for r, ch in enumerate(s):\n        if ch in last and last[ch] >= l:\n            l = last[ch] + 1              # jump left past the repeat\n        last[ch] = r\n        best = max(best, r - l + 1)\n    return best\n\ndef min_window(s, t):\n    from collections import Counter\n    need, missing = Counter(t), len(t)\n    l, best = 0, (0, 0)\n    for r, ch in enumerate(s):\n        if need[ch] > 0: missing -= 1\n        need[ch] -= 1\n        while missing == 0:               # valid: try to shrink\n            if not best[1] or r - l + 1 < best[1] - best[0]: best = (l, r + 1)\n            need[s[l]] += 1\n            if need[s[l]] > 0: missing += 1\n            l += 1\n    return s[best[0]:best[1]]", "problems": ["Max Sum Subarray of Size K: fixed window; running sum, add a[r], subtract a[r\u2212k].", "Longest Substring Without Repeating Characters: variable; map of last index; when a repeat is inside the window, jump l past it.", "Minimum Size Subarray Sum: variable; grow until sum \u2265 target, then shrink while it stays \u2265 target, recording length each shrink.", "Longest Repeating Character Replacement: window is valid when (length \u2212 maxFreq) \u2264 k; keep a count map and the max frequency seen.", "Permutation in String: fixed window of len(p); compare count maps, or track a 'matched letters' counter to stay O(1) per step.", "Minimum Window Substring: the template above; 'missing' tracks how many required characters are still absent."], "traps": ["Recomputing the window's state from scratch each step (O(n\u00b7k)).", "Recording the answer at the wrong moment for longest vs shortest.", "Shrinking with an if instead of a while."]}, "6": {"concept": "<p>A prefix sum array P where P[i] = sum of the first i elements lets you answer any range sum in O(1): sum(l..r) = P[r+1] \u2212 P[l]. Build it once in O(n). The deeper idea: <b>a subarray property can often be rewritten as a difference of two prefix values</b>, and a hash map of prefix values you have seen turns \"count subarrays with property X\" into one pass.</p>\n<h4>The pattern for counting subarrays</h4>\n<p>You want subarrays with sum k. If prefix sum now is P, then any earlier prefix equal to P \u2212 k marks the start of a valid subarray. So keep a map of prefix \u2192 how many times seen (seed with {0:1}), and at each step add count[P \u2212 k] to the answer. This same trick handles \"equal 0s and 1s\" (treat 0 as \u22121, look for equal prefixes) and \"divisible by k\" (store prefix mod k).</p>\n<h4>Hashing for grouping</h4><p>When you need to group things that are \"the same under some transformation\", compute a canonical key (sorted letters, a count tuple) and bucket by it. Longest Consecutive Sequence uses a set to check neighbours in O(1) and only starts counting from sequence starts, so each element is visited a constant number of times.</p>", "template": "def subarray_sum_k(a, k):\n    seen, P, ans = {0: 1}, 0, 0\n    for x in a:\n        P += x\n        ans += seen.get(P - k, 0)\n        seen[P] = seen.get(P, 0) + 1\n    return ans\n\ndef product_except_self(a):\n    n = len(a); out = [1] * n\n    left = 1\n    for i in range(n): out[i] = left; left *= a[i]\n    right = 1\n    for i in range(n-1, -1, -1): out[i] *= right; right *= a[i]\n    return out", "problems": ["Range Sum Query Immutable: build the prefix array once; each query is P[r+1] \u2212 P[l].", "Subarray Sum Equals K: the template; seed the map with prefix 0 seen once.", "Contiguous Array: map 0 \u2192 \u22121; store the first index each prefix value appears; length = i \u2212 firstIndex[P].", "Product of Array Except Self: prefix products from the left, then suffix products multiplied in from the right. No division.", "Group Anagrams: key = sorted string or 26-count tuple; map key \u2192 list.", "Longest Consecutive Sequence: put all in a set; only start counting at x when x\u22121 is not in the set; walk upward. O(n)."], "traps": ["Forgetting to seed the prefix map with 0.", "Using division in Product Except Self (breaks on zeros).", "Counting from every element in Longest Consecutive (O(n\u00b2))."]}, "7": {"concept": "<p>Binary search finds a target in a sorted range in O(log n) by halving the range each step. The bigger idea: it works on any <b>monotonic predicate</b> \u2014 a yes/no question whose answer flips from false to true exactly once across the range. You are looking for the flip point.</p>\n<h4>The one template to memorise</h4>\n<p>Search for the smallest index where <code>ok(mid)</code> is true: lo = first candidate, hi = last candidate + 1 (exclusive); while lo &lt; hi: mid = (lo+hi)//2; if ok(mid): hi = mid else lo = mid+1; answer is lo. Because hi is exclusive and lo only moves past failing values, there are no off-by-one loops or infinite loops.</p>\n<h4>Binary search on the answer</h4><p>When a problem asks for \"the minimum speed/capacity/days such that a condition holds\", the answer space is a number range, and the condition is monotonic (a faster speed always still works). Binary search that range and write a helper that checks feasibility in O(n). Total O(n log range).</p>\n<h4>Rotated arrays</h4><p>One half is always sorted. Check which half is sorted and whether the target lies in it; discard the other half.</p>", "template": "def first_true(lo, hi, ok):          # hi exclusive; returns first i with ok(i)\n    while lo < hi:\n        mid = (lo + hi) // 2\n        if ok(mid): hi = mid\n        else: lo = mid + 1\n    return lo\n\ndef koko(piles, h):\n    import math\n    ok = lambda k: sum(math.ceil(p / k) for p in piles) <= h\n    return first_true(1, max(piles) + 1, ok)", "problems": ["Binary Search: plain template; ok(i) = a[i] \u2265 target, then check a[lo] == target.", "First Bad Version: ok(i) = isBadVersion(i). Literal flip-point search.", "Search in Rotated Sorted Array: decide which half of [lo, hi] is sorted and whether target is inside it.", "Find Minimum in Rotated Sorted Array: compare a[mid] with a[hi]; if a[mid] > a[hi] the minimum is to the right, else it is at mid or left.", "Koko Eating Bananas: binary search on speed k from 1 to max(piles); feasibility check is O(n).", "Median of Two Sorted Arrays (stretch): binary search the partition point in the smaller array so left halves have equal size and every left element \u2264 every right element."], "traps": ["Inclusive/exclusive confusion \u2014 pick one template and keep it.", "Predicate that is not monotonic (binary search will lie).", "Overflow of lo+hi in fixed-width languages; use lo + (hi\u2212lo)//2."]}, "8": {"concept": "<p>A stack keeps the most recent unresolved item on top. Reach for it when the problem involves <b>nesting</b> (brackets, expressions) or <b>waiting for a later element to resolve an earlier one</b>.</p>\n<h4>Monotonic stack</h4>\n<p>A stack whose values are kept sorted (say, decreasing) by popping anything that would break the order before pushing. Each element is pushed once and popped at most once, so the whole pass is O(n). The moment you pop an element is exactly when you have found its \"next greater element\" \u2014 the thing that popped it. This answers a whole family of questions: next greater/smaller to the right or left, how far until a bigger value, the widest range in which an element is the minimum.</p>\n<h4>How to choose the direction</h4><p>Next <i>greater</i>: keep the stack decreasing, pop while the new value is bigger. Next <i>smaller</i>: keep it increasing. Store indices, not values, so you can compute distances.</p>", "template": "def daily_temperatures(t):\n    ans, st = [0] * len(t), []          # st holds indices, decreasing temps\n    for i, x in enumerate(t):\n        while st and t[st[-1]] < x:\n            j = st.pop(); ans[j] = i - j\n        st.append(i)\n    return ans\n\ndef largest_rectangle(h):\n    st, best = [], 0\n    for i, x in enumerate(h + [0]):     # sentinel flushes the stack\n        while st and h[st[-1]] >= x:\n            height = h[st.pop()]\n            left = st[-1] if st else -1\n            best = max(best, height * (i - left - 1))\n        st.append(i)\n    return best", "problems": ["Valid Parentheses: push openers; on a closer, the top must be the matching opener. Empty stack at the end means valid.", "Min Stack: a second stack that stores the minimum so far at each level, pushed and popped in lockstep.", "Daily Temperatures: monotonic decreasing stack of indices; popping gives the answer for the popped day.", "Next Greater Element II: circular, so iterate 2n times over i mod n; only push indices from the first pass.", "Largest Rectangle in Histogram: increasing stack; when a bar pops, its rectangle spans from the new top to the current index. Add a 0 sentinel.", "Evaluate Reverse Polish Notation: push numbers; on an operator pop two, compute, push. Mind operand order and integer division toward zero."], "traps": ["Comparing with the wrong inequality (\u2265 vs >) and mis-handling equal heights.", "Forgetting the sentinel that flushes the stack at the end.", "Storing values when you need indices."]}, "9": {"concept": "<p>Linked list problems are pointer-manipulation problems. Two habits remove most bugs: <b>use a dummy head</b> so the real head is never a special case, and <b>draw the nodes before and after</b> each pointer change.</p>\n<h4>Fast and slow pointers</h4>\n<p>Two pointers that move at different speeds along the list. Fast moves 2, slow moves 1. When fast reaches the end, slow is at the middle. If there is a cycle, fast will eventually lap slow and they meet (Floyd's algorithm). To find where the cycle starts, after they meet reset one pointer to the head and move both by 1; they meet at the cycle entry.</p>\n<h4>In-place reversal</h4><p>Walk with prev and cur; at each node save next, point cur.next to prev, advance. Reversing a sub-range is the same with careful reconnection at the boundaries.</p>\n<h4>Two-pointer gap</h4><p>To find the k-th node from the end, advance one pointer k steps, then move both until the leader hits the end.</p>", "template": "def reverse(head):\n    prev, cur = None, head\n    while cur:\n        nxt = cur.next\n        cur.next = prev\n        prev, cur = cur, nxt\n    return prev\n\ndef middle(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow, fast = slow.next, fast.next.next\n    return slow\n\ndef cycle_start(head):\n    slow = fast = head\n    while fast and fast.next:\n        slow, fast = slow.next, fast.next.next\n        if slow is fast:\n            p = head\n            while p is not slow: p, slow = p.next, slow.next\n            return p\n    return None", "problems": ["Reverse Linked List: the three-line loop above; also write it recursively once.", "Middle of the Linked List: fast/slow; note which middle you get for even lengths.", "Linked List Cycle II: Floyd's meet, then the reset-and-walk trick to find the entry.", "Merge Two Sorted Lists: dummy head, tail pointer, attach the smaller node each step, append whatever remains.", "Reorder List: find the middle, reverse the second half, then interleave the two halves.", "Remove Nth Node From End: dummy head; lead pointer advances n+1 steps; move both; unlink lead's follower."], "traps": ["Overwriting .next before saving it.", "No dummy head, then special-casing removal of the head.", "Fast pointer dereferencing None \u2014 always check fast and fast.next."]}, "10": {"concept": "<p>A tree is a recursive structure: every subtree is itself a tree. So almost every tree problem is solved by a function that <b>asks its children a question and combines their answers</b>. That is depth-first search (DFS) with recursion.</p>\n<h4>The two DFS shapes</h4>\n<ol><li><b>Return a value up</b>: height, size, \"is balanced\", \"max path\". The function returns something about its subtree; the parent combines left and right results.</li>\n<li><b>Carry state down</b>: current path, running sum, depth. Pass it as a parameter; use a shared accumulator (a list or nonlocal variable) for the answer.</li></ol>\n<h4>The subtle move: answer vs return value</h4><p>In Diameter, Max Path Sum and Balanced Tree, what a node returns to its parent (the best single downward path) is different from the best answer through that node (which may use both children). Keep a global best that you update at each node, and return only what the parent can extend.</p>\n<h4>Traversal orders</h4><p>Preorder: process node before children. Postorder: after (needed when the node's answer depends on the children). Inorder: left, node, right.</p>", "template": "def diameter(root):\n    best = 0\n    def depth(n):\n        nonlocal best\n        if not n: return 0\n        l, r = depth(n.left), depth(n.right)\n        best = max(best, l + r)          # answer uses both sides\n        return 1 + max(l, r)             # parent can extend only one side\n    depth(root)\n    return best\n\ndef path_sum_ii(root, target):\n    out, path = [], []\n    def dfs(n, rem):\n        if not n: return\n        path.append(n.val)\n        if not n.left and not n.right and rem == n.val: out.append(path[:])\n        dfs(n.left, rem - n.val); dfs(n.right, rem - n.val)\n        path.pop()                       # backtrack\n    dfs(root, target)\n    return out", "problems": ["Maximum Depth: 1 + max(depth(left), depth(right)); base case None \u2192 0.", "Invert Binary Tree: swap children, recurse on both.", "Diameter: the template; note the difference between the returned depth and the recorded best.", "Balanced Binary Tree: return height, or \u22121 as a sentinel meaning 'unbalanced below'; check |l\u2212r| \u2264 1 at each node.", "Lowest Common Ancestor: if the node is p or q return it; recurse both sides; if both sides return non-null, this node is the LCA, else return whichever is non-null.", "Path Sum II: carry the remaining sum down, keep the current path in a list, append a copy at a matching leaf, pop on the way back."], "traps": ["Forgetting the None base case.", "Returning the combined answer to the parent instead of the extendable one.", "Appending the shared path list itself instead of a copy."]}, "11": {"concept": "<p>Breadth-first search visits a tree level by level using a queue. Use it when the problem talks about <b>levels, rows, nearest, or minimum number of steps</b>. The key line: capture the queue's length at the start of each level so you know where the level ends.</p>\n<h4>Binary search tree (BST) property</h4>\n<p>Every node's left subtree holds smaller values and right subtree holds larger values. Consequences you will use: an inorder traversal produces sorted order; searching is O(h); validating requires passing down the allowed (low, high) range, not just comparing with the immediate parent.</p>\n<h4>Serialisation</h4><p>To store a tree as a string, do a preorder traversal writing a marker for nulls; to rebuild, read tokens in the same order and recurse. Preorder plus null markers uniquely determines the tree.</p>", "template": "from collections import deque\ndef level_order(root):\n    out, q = [], deque([root] if root else [])\n    while q:\n        level = []\n        for _ in range(len(q)):          # exactly one level\n            n = q.popleft(); level.append(n.val)\n            if n.left: q.append(n.left)\n            if n.right: q.append(n.right)\n        out.append(level)\n    return out\n\ndef is_valid_bst(root):\n    def ok(n, lo, hi):\n        if not n: return True\n        return lo < n.val < hi and ok(n.left, lo, n.val) and ok(n.right, n.val, hi)\n    return ok(root, float('-inf'), float('inf'))", "problems": ["Level Order Traversal: the template.", "Right Side View: level order, take the last element of each level.", "Validate BST: pass (lo, hi) bounds down; comparing only with the parent is the classic wrong answer.", "Kth Smallest in a BST: inorder traversal, stop at the k-th visited node.", "Serialize and Deserialize: preorder with '#' for null; deserialise with an iterator over the tokens.", "Binary Tree Maximum Path Sum (stretch): same shape as Diameter; a negative child contribution should be treated as 0."], "traps": ["Not snapshotting the queue length per level.", "Validating BST with only the parent's value.", "Serialising without null markers (ambiguous)."]}, "12": {"concept": "<p>A graph is nodes plus edges. Store it as an adjacency list (node \u2192 neighbours); a grid is a graph where each cell touches four neighbours. Traversal means visiting every reachable node once, using a <b>visited set</b> so you never revisit \u2014 that is what keeps it O(V + E).</p>\n<h4>DFS vs BFS</h4>\n<p>DFS (recursion or an explicit stack) goes deep first; good for \"is it connected\", \"flood fill\", \"count components\". BFS (queue) goes in rings; the only correct choice for <b>shortest number of steps</b> in an unweighted graph, and for \"spread over time\" simulations. Both are O(V + E).</p>\n<h4>Multi-source BFS</h4><p>Put all starting nodes in the queue at time 0 and run BFS once. Rotting Oranges is the canonical example; the level count is the elapsed time.</p>\n<h4>Reverse thinking</h4><p>Sometimes it is easier to start from the boundary and mark what is reachable from it (Pacific Atlantic, Surrounded Regions) than to test every cell.</p>", "template": "def num_islands(g):\n    R, C, count = len(g), len(g[0]), 0\n    def dfs(r, c):\n        if r < 0 or c < 0 or r >= R or c >= C or g[r][c] != '1': return\n        g[r][c] = '0'                    # mark visited in place\n        for dr, dc in ((1,0),(-1,0),(0,1),(0,-1)): dfs(r+dr, c+dc)\n    for r in range(R):\n        for c in range(C):\n            if g[r][c] == '1': count += 1; dfs(r, c)\n    return count", "problems": ["Number of Islands: every unvisited land cell starts a new DFS; count starts.", "Clone Graph: DFS with a map old-node \u2192 new-node; create the clone before recursing into neighbours to handle cycles.", "Max Area of Island: DFS returns 1 + sum of neighbour areas.", "Rotting Oranges: multi-source BFS from all rotten cells; answer is the number of levels; check for any fresh left over.", "Pacific Atlantic Water Flow: DFS from each ocean's border cells moving to cells of equal or greater height; answer is the intersection of the two reachable sets.", "Surrounded Regions: DFS from border O's and mark them safe; flip every other O."], "traps": ["Missing the visited set (infinite loop or O(V\u00b2)).", "Using DFS for shortest path.", "Recursion depth on huge grids \u2014 switch to an explicit stack if needed."]}, "13": {"concept": "<p>Two more graph tools that show up whenever a problem has <b>dependencies</b> or <b>merging groups</b>.</p>\n<h4>Topological sort</h4>\n<p>An ordering of a directed graph where every edge points forward. Only exists if there is no cycle. Kahn's algorithm: compute in-degree for each node; queue all nodes with in-degree 0; pop, append to the order, decrement each neighbour's in-degree, enqueue those that hit 0. If the order has fewer than V nodes, there is a cycle. O(V + E). Recognise it from \"prerequisites\", \"build order\", \"can all tasks finish\".</p>\n<h4>Union-find (disjoint set union)</h4>\n<p>Tracks which group each element belongs to with two operations: find(x) returns the group's representative; union(a, b) merges two groups. With path compression and union by rank both are nearly O(1). Recognise it from \"connected components\", \"does adding this edge create a cycle\", \"merge accounts that share an email\". A tree with n nodes is valid iff it has exactly n\u22121 edges and no edge joins two already-connected nodes.</p>", "template": "from collections import deque, defaultdict\ndef topo_order(n, edges):                # edges: (a, b) means a before b\n    adj, indeg = defaultdict(list), [0] * n\n    for a, b in edges: adj[a].append(b); indeg[b] += 1\n    q, order = deque(i for i in range(n) if indeg[i] == 0), []\n    while q:\n        u = q.popleft(); order.append(u)\n        for v in adj[u]:\n            indeg[v] -= 1\n            if indeg[v] == 0: q.append(v)\n    return order if len(order) == n else None   # None = cycle\n\nclass DSU:\n    def __init__(self, n): self.p = list(range(n))\n    def find(self, x):\n        while self.p[x] != x:\n            self.p[x] = self.p[self.p[x]]; x = self.p[x]\n        return x\n    def union(self, a, b):\n        a, b = self.find(a), self.find(b)\n        if a == b: return False\n        self.p[a] = b; return True", "problems": ["Course Schedule: topo sort; return whether all courses were ordered.", "Course Schedule II: same, return the order (empty if a cycle).", "Number of Connected Components: DSU; start with n components, subtract one per successful union.", "Redundant Connection: process edges in order; the first union that fails is the redundant edge.", "Graph Valid Tree: exactly n\u22121 edges and all unions succeed.", "Accounts Merge: union accounts that share an email; group emails by their root; sort each group."], "traps": ["Building edges in the wrong direction.", "Forgetting the cycle check (order shorter than n).", "Union-find without path compression on large inputs."]}, "14": {"concept": "<p>Backtracking explores every candidate solution by building it one choice at a time, and <b>undoing</b> the choice when it leads nowhere. It is DFS over the space of partial solutions. Use it when the problem says all combinations, all permutations, all subsets, or any arrangement satisfying constraints.</p>\n<h4>The template</h4>\n<p>choose \u2192 explore \u2192 unchoose. Keep a current path; at each level loop over the available options; add one, recurse, remove it. Record the path when it is complete. The \"unchoose\" step is what lets the same path list be reused instead of copying every time.</p>\n<h4>Controlling duplicates and order</h4>\n<p>Subsets and combinations: pass a start index so you only pick options after the last one (no reordering). Permutations: use a used[] array. Repeated values allowed: recurse with the same index. Duplicate input values: sort, and skip an option if it equals the previous option at the same level.</p>\n<h4>Pruning</h4><p>Return early when the partial solution already violates the constraint (sum exceeded, invalid prefix). Good pruning is the difference between passing and timing out.</p>", "template": "def subsets(nums):\n    out, path = [], []\n    def bt(start):\n        out.append(path[:])              # every path is a subset\n        for i in range(start, len(nums)):\n            path.append(nums[i])         # choose\n            bt(i + 1)                    # explore\n            path.pop()                   # unchoose\n    bt(0)\n    return out\n\ndef combination_sum(cands, target):\n    out, path = [], []\n    def bt(start, rem):\n        if rem == 0: out.append(path[:]); return\n        for i in range(start, len(cands)):\n            if cands[i] > rem: continue  # prune\n            path.append(cands[i]); bt(i, rem - cands[i]); path.pop()\n    bt(0, target)\n    return out", "problems": ["Subsets: the template; record at every node.", "Permutations: loop over all indices with a used[] array; record when path length equals n.", "Combination Sum: start index allows reuse (recurse with i, not i+1); prune when a candidate exceeds the remainder.", "Word Search: DFS from each cell; mark the cell visited by temporarily overwriting it; restore on return.", "Palindrome Partitioning: at each position try every prefix that is a palindrome, recurse on the rest.", "N-Queens: place one queen per row; keep sets of used columns and both diagonals (r\u2212c and r+c) for O(1) conflict checks."], "traps": ["Appending the path itself instead of a copy.", "Forgetting to unchoose (state leaks between branches).", "No pruning, then timing out."]}, "15": {"concept": "<p>Two tools for <b>optimisation under order</b>.</p>\n<h4>Heaps (priority queues)</h4>\n<p>A binary heap gives O(log n) insert and O(log n) removal of the smallest (min-heap) or largest element, and O(1) peek. Recognise it from \"top k\", \"k-th largest\", \"k closest\", \"merge k sorted\", \"schedule by priority\". The k-largest trick: keep a min-heap of size k; push each element, pop when size exceeds k; what remains is the top k, in O(n log k). Most languages only ship a min-heap; negate values for a max-heap.</p>\n<h4>Greedy</h4>\n<p>Make the locally best choice at each step and never revisit it. Only correct when you can argue an exchange argument: swapping any other choice for the greedy one never makes things worse. Intervals are the classic playground: sort by start to merge, sort by end to pick the maximum number of non-overlapping ones (always keep the one that ends earliest \u2014 it leaves the most room).</p>", "template": "import heapq\ndef top_k_frequent(nums, k):\n    from collections import Counter\n    return [x for x, _ in heapq.nlargest(k, Counter(nums).items(), key=lambda p: p[1])]\n\ndef kth_largest(nums, k):\n    h = []\n    for x in nums:\n        heapq.heappush(h, x)\n        if len(h) > k: heapq.heappop(h)\n    return h[0]\n\ndef merge_intervals(iv):\n    iv.sort(); out = []\n    for s, e in iv:\n        if out and s <= out[-1][1]: out[-1][1] = max(out[-1][1], e)\n        else: out.append([s, e])\n    return out", "problems": ["Kth Largest Element: min-heap of size k. Also learn quickselect for O(n) average.", "Top K Frequent Elements: count, then heap of size k on the counts (or bucket sort by frequency for O(n)).", "K Closest Points: max-heap of size k keyed by distance (negate the distance).", "Merge Intervals: sort by start; extend the last output interval or start a new one.", "Non-overlapping Intervals: sort by end; greedily keep intervals that start after the last kept end; answer = total \u2212 kept.", "Task Scheduler: the most frequent task dictates the frame: (maxFreq\u22121)\u00b7(n+1) + number of tasks with maxFreq, or len(tasks) if larger."], "traps": ["Using a max-heap where a size-k min-heap was needed (O(n log n) instead of O(n log k)).", "Sorting intervals by start when the greedy needs end.", "Assuming greedy works without an exchange argument."]}, "16": {"concept": "<p>Dynamic programming (DP) is recursion with memory. You use it when a problem has <b>optimal substructure</b> (the best answer is built from best answers to smaller versions) and <b>overlapping subproblems</b> (the same smaller versions come up repeatedly). Recognise it from \"number of ways\", \"minimum cost/steps\", \"maximum value\", \"is it possible\", combined with choices at each step.</p>\n<h4>The four-step recipe</h4>\n<ol><li><b>State</b>: what few numbers fully describe a subproblem? Usually an index (position in the array, amount remaining).</li>\n<li><b>Recurrence</b>: dp[i] in terms of smaller states \u2014 write out the choices at step i.</li>\n<li><b>Base cases</b>: the smallest states you can answer directly.</li>\n<li><b>Order</b>: fill from base cases upward (bottom-up table) or memoise a recursive function (top-down). Both are fine; top-down is easier to derive, bottom-up is easier to optimise for space.</li></ol>\n<h4>Derive it top-down first</h4><p>Write the plain recursive solution, add a memo dictionary, confirm it passes. Then convert to a table if you want. Space optimisation: if dp[i] only uses dp[i\u22121] and dp[i\u22122], keep two variables.</p>", "template": "def coin_change(coins, amount):          # min coins, bottom-up\n    INF = float('inf')\n    dp = [0] + [INF] * amount\n    for a in range(1, amount + 1):\n        for c in coins:\n            if c <= a: dp[a] = min(dp[a], dp[a - c] + 1)\n    return dp[amount] if dp[amount] < INF else -1\n\ndef word_break(s, words):\n    words = set(words); n = len(s)\n    dp = [True] + [False] * n              # dp[i]: s[:i] breakable\n    for i in range(1, n + 1):\n        for j in range(i):\n            if dp[j] and s[j:i] in words: dp[i] = True; break\n    return dp[n]", "problems": ["Climbing Stairs: dp[i] = dp[i\u22121] + dp[i\u22122]. It is Fibonacci; two variables suffice.", "House Robber: dp[i] = max(dp[i\u22121], dp[i\u22122] + a[i]): skip house i or rob it.", "Coin Change: dp[a] = 1 + min over coins of dp[a \u2212 c]. Unreachable amounts stay infinite.", "Longest Increasing Subsequence: dp[i] = 1 + max dp[j] for j < i with a[j] < a[i], O(n\u00b2). Then the patience-sorting O(n log n) version with binary search.", "Word Break: dp[i] true if some j < i has dp[j] true and s[j:i] in the dictionary.", "Decode Ways: dp[i] adds dp[i\u22121] if the last digit is valid and dp[i\u22122] if the last two digits form 10\u201326."], "traps": ["Choosing a state that does not fully describe the subproblem.", "Off-by-one in base cases (dp[0] means 'empty', not 'first element').", "Iterating in an order where a needed state is not yet computed."]}, "17": {"concept": "<p>When a subproblem needs <b>two indices</b> \u2014 a position in each of two strings, a row and a column in a grid, a range [i, j] in one string \u2014 the DP table becomes 2-D. The recipe is the same: state, recurrence, base cases, fill order. What changes is that you now think about which neighbours each cell depends on: usually up, left, and diagonal.</p>\n<h4>The three classic recurrences</h4>\n<ul><li><b>Grid paths</b>: dp[r][c] = dp[r\u22121][c] + dp[r][c\u22121].</li>\n<li><b>Two strings (LCS / edit distance)</b>: if the characters match, take the diagonal; otherwise combine up/left/diagonal. Row 0 and column 0 are the \"empty string\" base cases.</li>\n<li><b>Interval / substring</b>: dp[i][j] describes s[i..j]; fill by increasing length, since s[i..j] depends on s[i+1..j\u22121].</li></ul>\n<h4>0/1 knapsack</h4><p>State: (item index, remaining capacity). Recurrence: skip the item or take it. Iterate capacity <b>downward</b> when using a 1-D array so each item is used at most once.</p>\n<h4>State machines</h4><p>Stock problems with cooldown or fees: keep one DP value per \"state\" (holding, not holding, cooling down) and write the transitions between them.</p>", "template": "def lcs(a, b):\n    m, n = len(a), len(b)\n    dp = [[0] * (n + 1) for _ in range(m + 1)]\n    for i in range(1, m + 1):\n        for j in range(1, n + 1):\n            dp[i][j] = dp[i-1][j-1] + 1 if a[i-1] == b[j-1] else max(dp[i-1][j], dp[i][j-1])\n    return dp[m][n]\n\ndef can_partition(nums):\n    total = sum(nums)\n    if total % 2: return False\n    target = total // 2\n    dp = [True] + [False] * target\n    for x in nums:\n        for c in range(target, x - 1, -1):   # downward: use each item once\n            dp[c] = dp[c] or dp[c - x]\n    return dp[target]", "problems": ["Unique Paths: grid recurrence; first row and column are all 1.", "Longest Common Subsequence: the template.", "Edit Distance: match \u2192 diagonal; else 1 + min(insert=left, delete=up, replace=diagonal).", "Partition Equal Subset Sum: 0/1 knapsack with a boolean array; capacity iterated downward.", "Longest Palindromic Substring: expand around each centre (O(n\u00b2), O(1) space) or interval DP by length.", "Best Time to Buy/Sell with Cooldown: three states \u2014 hold, sold (just now), rest \u2014 with transitions; answer is max of sold and rest at the end."], "traps": ["Iterating knapsack capacity upward (item reused).", "Wrong base row/column for empty-string cases.", "Interval DP filled in index order instead of length order."]}, "18": {"concept": "<p>When edges have <b>weights</b>, BFS no longer gives shortest paths. Three algorithms cover almost everything.</p>\n<h4>Dijkstra</h4><p>Shortest paths from one source with non-negative weights. Min-heap of (distance, node); pop the closest unfinalised node, relax its edges (if dist[u] + w &lt; dist[v], update and push). Skip a popped entry if its distance is stale. O(E log V). Recognise it from \"minimum time/cost to reach\", \"network delay\", or a grid where moving costs something.</p>\n<h4>Bellman-Ford (bounded)</h4><p>Relax all edges V\u22121 times; handles negative weights. The bounded variant \u2014 relax exactly k+1 rounds using a copy of the distance array each round \u2014 answers \"cheapest path with at most k stops\".</p>\n<h4>Minimum spanning tree</h4><p>Connect every node with the least total edge weight. Kruskal: sort edges, add each one whose endpoints are not yet connected (union-find). Prim: grow from one node with a heap of boundary edges. Recognise it from \"connect all points with minimum cost\".</p>\n<h4>Modelling problems as graphs</h4><p>Word Ladder: words are nodes, one-letter changes are edges, BFS gives the fewest steps. Alien Dictionary: adjacent words give ordering edges, topological sort gives the alphabet. Swim in Rising Water: minimise the maximum cell along a path \u2014 Dijkstra where the \"distance\" is max(so far, cell), or binary search on the answer with a reachability check.</p>", "template": "import heapq\ndef dijkstra(adj, src, n):               # adj[u] = [(v, w), ...]\n    dist = [float('inf')] * n; dist[src] = 0\n    pq = [(0, src)]\n    while pq:\n        d, u = heapq.heappop(pq)\n        if d > dist[u]: continue         # stale entry\n        for v, w in adj[u]:\n            if d + w < dist[v]:\n                dist[v] = d + w; heapq.heappush(pq, (dist[v], v))\n    return dist\n\ndef cheapest_k_stops(n, flights, src, dst, k):\n    dist = [float('inf')] * n; dist[src] = 0\n    for _ in range(k + 1):\n        nxt = dist[:]\n        for u, v, w in flights:\n            if dist[u] + w < nxt[v]: nxt[v] = dist[u] + w\n        dist = nxt\n    return dist[dst] if dist[dst] < float('inf') else -1", "problems": ["Network Delay Time: Dijkstra from the source; answer is the max finite distance, or \u22121 if any node is unreachable.", "Cheapest Flights Within K Stops: bounded Bellman-Ford with k+1 rounds and a copied array per round.", "Min Cost to Connect All Points: Kruskal with union-find over all O(n\u00b2) Manhattan edges, or Prim with a heap.", "Word Ladder: BFS; generate neighbours by substituting each position with a\u2013z and checking the word set.", "Alien Dictionary: build edges from the first differing character of adjacent words; topological sort; detect invalid prefix cases.", "Swim in Rising Water: Dijkstra with distance = max(current, cell value), or binary search the time with BFS reachability."], "traps": ["Not skipping stale heap entries in Dijkstra.", "Bellman-Ford rounds relaxing in place instead of from a copy (allows extra stops).", "Using Dijkstra with negative edges."]}, "19": {"concept": "<p>Everything before this week trained execution: given the pattern, write the code. This week trains <b>recognition</b>: given a bare problem, name the pattern. That is the skill interviews actually test, and it is the one most people never practise on purpose.</p>\n<h4>The five-minute protocol</h4>\n<ol><li>Read the problem twice. Write down the input type, the output type, and the constraints (n \u2264 10\u2075 rules out O(n\u00b2)).</li>\n<li>List the tells you notice: sorted? contiguous? \"all combinations\"? \"shortest\"? \"number of ways\"? dependencies? top-k?</li>\n<li>Name one or two candidate patterns. Say why the constraints allow them.</li>\n<li>Sketch the state you would keep (window state, DP state, stack contents) before writing any code.</li>\n<li>Only then implement \u2014 from your own template of that week.</li></ol>\n<h4>Quick tell-to-pattern index</h4>\n<table><tr><th>Tell</th><th>First thing to try</th></tr>\n<tr><td>Sorted, pairs, in-place</td><td>Two pointers</td></tr>\n<tr><td>Contiguous subarray/substring, longest/shortest</td><td>Sliding window</td></tr>\n<tr><td>Count subarrays with sum/property</td><td>Prefix sum + map</td></tr>\n<tr><td>Monotonic condition, \"minimum X such that\"</td><td>Binary search</td></tr>\n<tr><td>Next greater/smaller, nesting</td><td>(Monotonic) stack</td></tr>\n<tr><td>Tree, \"for each node\"</td><td>DFS returning values</td></tr>\n<tr><td>Levels, nearest, fewest steps (unweighted)</td><td>BFS</td></tr>\n<tr><td>Prerequisites, ordering</td><td>Topological sort</td></tr>\n<tr><td>Components, cycle on add</td><td>Union-find</td></tr>\n<tr><td>All combinations/arrangements</td><td>Backtracking</td></tr>\n<tr><td>Top k, k-th, schedule</td><td>Heap / greedy</td></tr>\n<tr><td>Number of ways, min cost, choices</td><td>DP</td></tr>\n<tr><td>Weighted shortest path, connect all</td><td>Dijkstra / MST</td></tr></table>\n<h4>After Week 20</h4><p>Repeat this week's format indefinitely. Add tries (prefix trees: autocomplete, word search on many words), bit manipulation (XOR tricks, counting bits), and design problems (LRU cache = hash map + doubly linked list) as bonus weeks.</p>", "template": "# Recognition log \u2014 fill this before coding every problem this week\n# Problem:\n# Input/Output:\n# Constraints (n ~ ?):  => rules out:\n# Tells I see:\n# Candidate pattern(s):\n# State I will keep:\n# Time / space target:", "problems": ["Random medium #1: pick from any past week's problem list without looking at the week. Time the recognition step.", "Random medium #2: same. If recognition took over 5 minutes, re-read that week's lesson.", "Random medium #3: same. Record recognition time in your log.", "Random hard #1: choose a stretch problem or a hard from the same families.", "Random hard #2: same; allow 40 minutes, then read the editorial and re-implement from memory.", "Random hard #3: same. On Day 7, tally: how many patterns did you name correctly within 5 minutes?"], "traps": ["Jumping to code before naming the pattern.", "Ignoring constraints \u2014 they are the biggest hint on the page.", "Only practising the patterns you already like."]}}
;
let ltab = "concept";
function renderLesson(){
  const w=state.view, L=LESSONS[w], wk=PLAN[w]; const c=$("#lcard");
  const probs=L.problems.map((t,i)=>{const [a,...b]=t.split(": ");return `<li><b>Day ${i+1} — ${esc(a)}</b>: ${esc(b.join(": "))}</li>`;}).join("");
  const traps=L.traps.map(t=>`<li>${t}</li>`).join("");
  c.innerHTML=`<details open><summary>Week ${w+1} lesson: ${esc(wk.t)}</summary>
    <div class="ltabs">
      <button class="ltab ${ltab==="concept"?"on":""}" data-t="concept">Concept</button>
      <button class="ltab ${ltab==="template"?"on":""}" data-t="template">Code template</button>
      <button class="ltab ${ltab==="problems"?"on":""}" data-t="problems">How to approach each problem</button>
    </div>
    <div class="lbody">
      <div class="lpane ${ltab==="concept"?"on":""}">${L.concept}</div>
      <div class="lpane ${ltab==="template"?"on":""}"><p>Copy this into your editor, then close it and reproduce it from memory before Day 7.</p><pre><code>${esc(L.template)}</code></pre></div>
      <div class="lpane ${ltab==="problems"?"on":""}"><ol class="probs">${probs}</ol><div class="traps"><b>Traps this week</b><ul>${traps}</ul></div></div>
    </div></details>`;
  c.querySelectorAll(".ltab").forEach(b=>b.onclick=()=>{ltab=b.dataset.t;renderLesson();});
}

const SLUGS = [["two-sum", "contains-duplicate", "reverse-string", "best-time-to-buy-and-sell-stock", "move-zeroes", "merge-sorted-array"], ["valid-anagram", "majority-element", "intersection-of-two-arrays-ii", "first-unique-character-in-a-string", "ransom-note", "isomorphic-strings"], ["fibonacci-number", "power-of-two", "reverse-string", "sort-an-array", "sort-colors", "powx-n"], ["implement-stack-using-queues", "implement-queue-using-stacks", "design-linked-list", "design-hashmap", "binary-tree-inorder-traversal", "number-of-islands"], ["two-sum-ii-input-array-is-sorted", "valid-palindrome", "remove-duplicates-from-sorted-array", "container-with-most-water", "3sum", "trapping-rain-water"], ["maximum-average-subarray-i", "longest-substring-without-repeating-characters", "minimum-size-subarray-sum", "longest-repeating-character-replacement", "permutation-in-string", "minimum-window-substring"], ["range-sum-query-immutable", "subarray-sum-equals-k", "contiguous-array", "product-of-array-except-self", "group-anagrams", "longest-consecutive-sequence"], ["binary-search", "first-bad-version", "search-in-rotated-sorted-array", "find-minimum-in-rotated-sorted-array", "koko-eating-bananas", "median-of-two-sorted-arrays"], ["valid-parentheses", "min-stack", "daily-temperatures", "next-greater-element-ii", "largest-rectangle-in-histogram", "evaluate-reverse-polish-notation"], ["reverse-linked-list", "middle-of-the-linked-list", "linked-list-cycle-ii", "merge-two-sorted-lists", "reorder-list", "remove-nth-node-from-end-of-list"], ["maximum-depth-of-binary-tree", "invert-binary-tree", "diameter-of-binary-tree", "balanced-binary-tree", "lowest-common-ancestor-of-a-binary-tree", "path-sum-ii"], ["binary-tree-level-order-traversal", "binary-tree-right-side-view", "validate-binary-search-tree", "kth-smallest-element-in-a-bst", "serialize-and-deserialize-binary-tree", "binary-tree-maximum-path-sum"], ["number-of-islands", "clone-graph", "max-area-of-island", "rotting-oranges", "pacific-atlantic-water-flow", "surrounded-regions"], ["course-schedule", "course-schedule-ii", "number-of-connected-components-in-an-undirected-graph", "redundant-connection", "graph-valid-tree", "accounts-merge"], ["subsets", "permutations", "combination-sum", "word-search", "palindrome-partitioning", "n-queens"], ["kth-largest-element-in-an-array", "top-k-frequent-elements", "k-closest-points-to-origin", "merge-intervals", "non-overlapping-intervals", "task-scheduler"], ["climbing-stairs", "house-robber", "coin-change", "longest-increasing-subsequence", "word-break", "decode-ways"], ["unique-paths", "longest-common-subsequence", "edit-distance", "partition-equal-subset-sum", "longest-palindromic-substring", "best-time-to-buy-and-sell-stock-with-cooldown"], ["network-delay-time", "cheapest-flights-within-k-stops", "min-cost-to-connect-all-points", "word-ladder", "alien-dictionary", "swim-in-rising-water"], [null, null, null, null, null, null]];
function plink(w,d){ const s=SLUGS[w][d]; if(s) return 'https://leetcode.com/problems/'+s+'/'; return 'https://leetcode.com/problemset/?difficulty='+(d<3?'MEDIUM':'HARD'); }
let state = {start:"2026-09-28", days:{}, templates:{}, view:null};
let saveTimer=null;
const $=s=>document.querySelector(s);
const key=(w,d)=>`w${w+1}d${d+1}`;
const rec=(w,d)=>state.days[key(w,d)]||{};

function currentWeek(){
  const s=new Date(state.start+"T00:00:00"), n=new Date(); n.setHours(0,0,0,0);
  const diff=Math.floor((n-s)/864e5); if(diff<0) return {w:0,d:-1};
  return {w:Math.min(19,Math.floor(diff/7)), d:Math.min(5,diff%7)};
}
function counts(){
  let done=0,un=0,rv=0;
  Object.values(state.days).forEach(r=>{ if(r.done)done++; if(r.unaided)un++; if(r.revisit)rv++; });
  return {done,un,rv};
}

function renderMatrix(){
  const cur=currentWeek(); const g=$("#mgrid"); g.innerHTML="";
  g.appendChild(el("div","lbl",""));
  for(let w=0;w<20;w++){ const b=el("button","wk"+(w===state.view?" cur":""),"W"+(w+1)); b.onclick=()=>{state.view=w;render();}; g.appendChild(b); }
  for(let d=0;d<6;d++){
    g.appendChild(el("div","lbl","Day "+(d+1)));
    for(let w=0;w<20;w++){
      const r=rec(w,d); const b=el("button","dot"+(r.done?" done":"")+(r.unaided?" unaided":"")+(r.revisit&&!r.done?" revisit":"")+(cur.w===w&&cur.d===d?" today":""));
      b.title=`Week ${w+1}, Day ${d+1}: ${PLAN[w].p[d]}`; b.setAttribute("aria-label",b.title);
      b.onclick=()=>{state.view=w;render();document.getElementById("day"+d)?.scrollIntoView({behavior:"smooth",block:"center"});};
      g.appendChild(b);
    }
  }
  const c=counts(); $("#doneCount").textContent=c.done; $("#unaidedCount").textContent=c.un; $("#revisitCount").textContent=c.rv;
  $("#bar").style.width=(c.done/120*100)+"%";
}

function renderWeek(){
  const w=state.view, wk=PLAN[w]; const a=$("#wcard");
  a.innerHTML=`<div class="phase">${wk.ph} · Week ${w+1} of 20</div><h2>${wk.t}</h2>
  <div class="tell"><b>The tell</b>${wk.tell}</div>
  <label class="small" for="tpl">Pattern template (write it at the end of the week: skeleton code + signals)</label>
  <textarea id="tpl" placeholder="e.g. l=0; for r in range(n): expand; while invalid: shrink l…">${esc(state.templates["w"+(w+1)]||"")}</textarea>
  <div class="navrow"><button class="btn" id="prevW" ${w===0?"disabled":""}>Previous week</button><button class="btn" id="nextW" ${w===19?"disabled":""}>Next week</button></div>`;
  $("#tpl").oninput=e=>{state.templates["w"+(w+1)]=e.target.value; save();};
  $("#prevW").onclick=()=>{state.view=w-1;render();};
  $("#nextW").onclick=()=>{state.view=w+1;render();};

  const c=$("#dcard"); c.innerHTML="";
  wk.p.forEach((name,d)=>{
    const r=rec(w,d); const stretch=name.endsWith("*");
    const row=el("div","day"+(r.done?" done":"")+(r.open?" open":"")); row.id="day"+d;
    row.innerHTML=`<button class="check" aria-label="Mark solved">${r.done?"✓":""}</button>
      <div><div class="dtop"><span class="dnum">Day ${d+1}</span><a class="pname" href="${plink(w,d)}" target="_blank" rel="noopener">${name.replace("*","")}</a>${stretch?'<span class="stretch">stretch</span>':""}
        <button class="pill ${r.unaided?"on":""}" data-k="unaided">Unaided</button>
        <button class="pill warn ${r.revisit?"on":""}" data-k="revisit">Revisit in 7 days</button>
        <button class="toggle">${r.open?"Hide log":"Log"}</button></div>
        <div class="dlog">
          <label class="small">What in the statement pointed to the pattern? Complexity? One mistake.</label>
          <textarea placeholder="Tell: …  T/S: O(n)/O(1)  Mistake: …">${esc(r.note||"")}</textarea>
        </div></div>`;
    row.querySelector(".check").onclick=()=>set(w,d,{done:!r.done});
    row.querySelectorAll(".pill").forEach(p=>p.onclick=()=>set(w,d,{[p.dataset.k]:!r[p.dataset.k]}));
    row.querySelector(".toggle").onclick=()=>set(w,d,{open:!r.open},false);
    row.querySelector("textarea").oninput=e=>set(w,d,{note:e.target.value},true,true);
    c.appendChild(row);
  });
  const s=el("div","sunday",`Day 7 — review: re-solve this week's two hardest problems cold, then write or update the pattern template on the left. Also re-solve one problem from weeks ${Math.max(1,w-1)}–${Math.max(1,w-2)} if you skipped the 5-minute daily repeat.`);
  c.appendChild(s);
}

function set(w,d,patch,persist=true,quiet=false){
  const k=key(w,d); state.days[k]={...rec(w,d),...patch};
  if(persist) save();
  if(!quiet){ render(); }
}
function render(){ renderMatrix(); renderLesson(); renderWeek(); $("#startDate").value=state.start; }
function el(tag,cls,txt){ const e=document.createElement(tag); if(cls)e.className=cls; if(txt!=null)e.textContent=txt; return e; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function persisted(){ const {view,...rest}=state; const days={}; for(const k in rest.days){ const {open,...r}=rest.days[k]; if(Object.keys(r).length) days[k]=r; } return {...rest,days,updatedAt:new Date().toISOString()}; }
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem("dsa-tracker",JSON.stringify(persisted())); }
    catch(e){ $("#status").textContent="Couldn't save in this browser"; }
  },500);
}

const TRACKER_ID="dsa", EXPORT_NAME="dsa-progress.json";
function exportStamp(){ const d=new Date(), p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes()); }
function isMobile(){ const ua=navigator.userAgent||""; return /Android|iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints>1); }
async function exportProgress(){
  const data={tracker:TRACKER_ID, format:1, exportedAt:new Date().toISOString(), ...persisted()};
  const json=JSON.stringify(data,null,2), name=TRACKER_ID+"-progress-"+exportStamp()+".json", type="application/json";
  const done=n=>{ $("#status").textContent="Exported "+n; };
  // 1. Desktop Chrome / Edge: native Save As dialog. Pick any folder, including a Google Drive or iCloud Drive sync folder.
  if(window.showSaveFilePicker && !isMobile()){
    try{
      const h=await showSaveFilePicker({suggestedName:name, types:[{description:"JSON file", accept:{"application/json":[".json"]}}]});
      const w=await h.createWritable(); await w.write(json); await w.close();
      done(h.name||name); return;
    }catch(e){ if(e&&e.name==="AbortError") return; }
  }
  // 2. iPhone / iPad / Android: share sheet. "Save to Files" is iCloud Drive; Google Drive appears if the app is installed.
  if(isMobile() && navigator.canShare){
    try{
      const file=new File([json],name,{type});
      if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:name}); done(name); return; }
    }catch(e){ if(e&&e.name==="AbortError") return; }
  }
  // 3. Everything else (desktop Safari, Firefox): plain download to the Downloads folder.
  const url=URL.createObjectURL(new Blob([json],{type}));
  const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  done(name);
}
function importProgress(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try{ data=JSON.parse(reader.result); }catch(e){ alert("That file isn't valid JSON."); return; }
    if(!data||typeof data!=="object"||!data.days||typeof data.days!=="object"){ alert("That file doesn't look like a tracker export."); return; }
    if(data.tracker&&data.tracker!==TRACKER_ID){ alert("That file is from the "+data.tracker+" tracker, not this one."); return; }
    const count=d=>Object.values(d||{}).filter(r=>r&&r.done).length;
    const when=data.exportedAt||data.updatedAt, whenText=when?new Date(when).toLocaleString():"an unknown date";
    if(!confirm("Replace this browser's progress ("+count(state.days)+" done) with the file's progress ("+count(data.days)+" done, exported "+whenText+")?")) return;
    const {tracker,format,exportedAt,view,...rest}=data;
    state={...state,...rest}; if(!state.days)state.days={}; if(!state.templates)state.templates={};
    state.view=currentWeek().w; save(); render();
    $("#status").textContent="Imported "+file.name;
  };
  reader.onerror=()=>alert("Couldn't read that file.");
  reader.readAsText(file);
}
function wireTransfer(){
  $("#exportBtn").onclick=exportProgress;
  const inp=$("#importFile");
  $("#importBtn").onclick=()=>{ inp.value=""; inp.click(); };
  inp.onchange=()=>{ if(inp.files&&inp.files[0]) importProgress(inp.files[0]); };
}

function init(){
  try{ const l=localStorage.getItem("dsa-tracker"); if(l) state={...state,...JSON.parse(l)}; }catch(e){}
  const cw=currentWeek(); state.view=cw.w;
  render();
  $("#startDate").onchange=e=>{ state.start=e.target.value; state.view=currentWeek().w; save(); render(); };

  wireTransfer();
}
init();
</script>
<script>
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  addEventListener("load",()=>navigator.serviceWorker.register("../sw.js").catch(()=>{}));
}
</script>
